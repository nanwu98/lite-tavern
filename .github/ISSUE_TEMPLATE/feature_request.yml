name: Feature request
description: 提出一个功能建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        LiteTavern 的目标是「只做角色卡 + 世界书聊天」的极简客户端，
        没有群聊、插件市场和云同步。请先确认你的建议与这个方向一致。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 现在是什么体验，哪里不够用。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 描述期望的交互或行为，越具体越好。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你是否试过别的办法绕开这个问题。
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议属于角色卡 / 世界书聊天场景，不涉及插件市场或云同步
          required: true
